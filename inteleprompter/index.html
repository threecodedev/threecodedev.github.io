<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inTelePrompter</title>
<style>
  :root{--bg:#0A1520;--bg2:#0F1B2A;--card:#152435;--text:#F4F7FA;--sub:#A8B4C0;--accent:#E8833A;--border:rgba(232,131,58,.25)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:48px 24px 64px}
  h1{font-size:2rem;letter-spacing:-.02em;margin-bottom:8px}
  h1 .wm-in{color:#D97A28}
  h1 .wm-base{color:#4AADE8}
  .tagline{color:var(--sub);margin-bottom:36px}
  .cards{display:flex;gap:16px;flex-wrap:wrap}
  .cardlink{flex:1 1 260px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;text-decoration:none;color:var(--text);display:block}
  .cardlink:hover{filter:brightness(1.08)}
  .cardlink h2{font-size:1.15rem;margin-bottom:6px;color:var(--accent)}
  .cardlink p{color:var(--sub);font-size:.95rem}
  footer{margin-top:48px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);color:var(--sub);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="wm-in">in</span><span class="wm-base">TelePrompter</span></h1>
  <p class="tagline">A teleprompter for iPad and iPhone, from ThreeCode.</p>

  <div class="cards">
    <a class="cardlink" href="support.html">
      <h2>Support</h2>
      <p>Help, answers, and how to reach us.</p>
    </a>
    <a class="cardlink" href="privacy.html">
      <h2>Privacy Policy</h2>
      <p>What the app does with your data, in plain language.</p>
    </a>
  </div>

  <footer>
    <span>© 2026 ThreeCode. All rights reserved.</span>
    <a href="support.html">Support</a>
  </footer>
</div>
</body>
</html>
